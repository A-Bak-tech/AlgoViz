<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlgoViz: Sorting Algorithm Visualizer</title>
  <style>
    html, body { margin: 0; background: #121218; color: #ccc; font-family: system-ui, sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    canvas { display: block; border-radius: 8px; }
    a { color: #6495ed; }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <p>Built in C++ with raylib, compiled to WebAssembly ·
       <a href="https://github.com/A-Bak-tech/AlgoViz">Source on GitHub</a></p>
  </main>
  <script>var Module = { canvas: document.getElementById('canvas') };</script>
  <script async type="text/javascript" src="index.js"></script>
</body>
</html>
